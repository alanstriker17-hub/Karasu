name: Build app

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Build and Release v{0}', github.event.inputs.version) || github.event.commits[0].message }}

on:
  push:
    branches:
      - main
      - master
      - backport/**
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without "v" prefix)'
        required: true
        type: string
      beta:
        description: 'Beta release'
        default: false
        required: false
        type: boolean
      debug:
        description: 'Build a side-by-side debug-signed APK (beta only)'
        default: false
        required: false
        type: boolean
      message:
        description: 'Message for releases (the text at the top of changelog)'
        default: ''
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

# The repo default is read-only. Releases need to write contents; the test report writes a check.
permissions:
  contents: write
  checks: write

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    env:
      # Optional: nightlies only get published when a PAT for clevim/Karasu-nightly exists.
      NIGHTLY_PAT: ${{ secrets.NIGHTLY_PAT }}

    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Android SDK
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0"

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Setup CHANGELOG parser
        uses: taiki-e/install-action@parse-changelog

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Extract branch name
        id: branch_name
        shell: bash
        run: echo "NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Get changelog
        id: changelog
        shell: bash
        run: |
          # extended SemVer (major.minor.patch.hotfix)
          VERSION_FORMAT='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?(-[0-9A-Za-z\.-]+)?(\+[0-9A-Za-z\.-]+)?$|^Unreleased$'
          {
            echo "CHANGELOG<<END_OF_FILE"
            parse-changelog CHANGELOG.md ${{ github.event.inputs.version == '' && 'Unreleased' || github.event.inputs.version }} --version-format $VERSION_FORMAT || parse-changelog CHANGELOG.md Unreleased --version-format $VERSION_FORMAT || echo "No documented changes so far..."
            echo ""
            echo "END_OF_FILE"
          } >> "$GITHUB_OUTPUT" 2> /dev/null

      # PROD
      - name: Prepare release build
        if: github.event.inputs.version != '' && github.event.inputs.beta != 'true'
        run: |
          if [ "${{ github.event.inputs.debug }}" = "true" ]; then
            echo "Debug APKs must be published as beta releases." >&2
            exit 1
          fi
          set -x
          echo "VERSION_TAG=v${{github.event.inputs.version}}" >> $GITHUB_ENV
          echo "BUILD_TYPE=StandardRelease" >> $GITHUB_ENV

      # BETA
      - name: Prepare beta build
        if: github.event.inputs.version != '' && github.event.inputs.beta == 'true'
        run: |
          set -x

          BETA_COUNT=$(git tag -l --sort=refname "v${{github.event.inputs.version}}-b*" | tail -n1 | sed "s/^\S*-b//g")
          if [ -z "$BETA_COUNT" ]; then
            BETA_COUNT="1"
          else
            BETA_COUNT=$((BETA_COUNT+1))
          fi

          echo "VERSION_TAG=v${{github.event.inputs.version}}-b${BETA_COUNT}" >> $GITHUB_ENV
          if [ "${{ github.event.inputs.debug }}" = "true" ]; then
            echo "BUILD_TYPE=StandardDebug" >> $GITHUB_ENV
            echo "DEBUG_BUILD=true" >> $GITHUB_ENV
          else
            echo "BUILD_TYPE=StandardBeta" >> $GITHUB_ENV
          fi

      - name: Prepare branch debug beta
        if: startsWith(steps.branch_name.outputs.NAME, 'backport/debug-beta/')
        run: |
          VERSION_TAG="${GITHUB_REF_NAME#backport/debug-beta/}"
          if [[ ! "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-b[0-9]+$ ]]; then
            echo "Invalid debug beta branch name: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV
          echo "BUILD_TYPE=StandardDebug" >> $GITHUB_ENV
          echo "DEBUG_BUILD=true" >> $GITHUB_ENV

      # NIGHTLY
      - name: Prepare nightly build
        if: (steps.branch_name.outputs.NAME == 'master' || steps.branch_name.outputs.NAME == 'main') && github.event.inputs.version == ''
        run: |
          set -x
          echo "VERSION_TAG=r$(git rev-list --count HEAD)" >> $GITHUB_ENV
          echo "BUILD_TYPE=StandardNightly" >> $GITHUB_ENV
          echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "COMMIT_SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build the app
        if: startsWith(env.BUILD_TYPE, 'Standard')
        run: ./gradlew assemble${{ env.BUILD_TYPE }}

      - name: Run unit tests
        if: startsWith(env.BUILD_TYPE, 'Standard')
        run: ./gradlew testReleaseUnitTest test${{ env.BUILD_TYPE }}UnitTest

      - name: Upload R8 APK to artifact
        uses: actions/upload-artifact@v7
        if: env.VERSION_TAG != ''
        with:
          name: arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/standard/*/karasu*-arm64-v8a-*.apk

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        if: env.VERSION_TAG != ''
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/standard*

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          include_passed: true
          detailed_summary: true
          report_paths: '**/build/test-results/test*/TEST-*.xml'

      - name: Get version stage
        id: version_stage
        shell: bash
        run: |
          stage=""
          case "${{ env.VERSION_TAG }}" in
            v*)
              [ "$(echo '${{ env.VERSION_TAG }}' | grep 'v*-b')" = "" ] && stage="release" || stage="beta"
              ;;
            r*) stage="nightly" ;;
          esac
          [ "$stage" = "" ] && exit 1  # something went wrong

          echo "STAGE=${stage}" >> $GITHUB_OUTPUT

      - name: Sign APK
        if: env.VERSION_TAG != '' && steps.version_stage.outputs.STAGE != 'nightly' && env.DEBUG_BUILD != 'true'
        env:
          RELEASE_DIR: app/build/outputs/apk/standard/${{ env.DEBUG_BUILD == 'true' && 'debug' || steps.version_stage.outputs.STAGE }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$SIGNING_KEY" ] || [ -z "$ALIAS" ] || [ -z "$KEY_STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Configure SIGNING_KEY, ALIAS, KEY_STORE_PASSWORD, and KEY_PASSWORD to sign releases." >&2
            exit 1
          fi
          BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/35.0.0"
          echo "$SIGNING_KEY" | base64 -d > /tmp/signingkey.jks
          for apk in "$RELEASE_DIR"/karasu-standard-*.apk; do
            "$BUILD_TOOLS/zipalign" -p -f 4 "$apk" "$apk.aligned"
            "$BUILD_TOOLS/apksigner" sign \
              --ks /tmp/signingkey.jks \
              --out "${apk%.apk}-signed.apk" \
              --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$KEY_STORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              "$apk.aligned"
            rm "$apk.aligned"
            echo "signed \`$(basename "${apk%.apk}-signed.apk")\`" >> $GITHUB_STEP_SUMMARY
          done
          rm /tmp/signingkey.jks

      - name: Clean up build artifacts
        if: env.VERSION_TAG != ''
        run: |
          set -e

          build_stage="${{ env.DEBUG_BUILD == 'true' && 'debug' || steps.version_stage.outputs.STAGE }}"
          dir="app/build/outputs/apk/standard/${build_stage}"
          signed_suffix=""
          if [ "${{ env.DEBUG_BUILD }}" != "true" ] && [ "${{ steps.version_stage.outputs.STAGE }}" != "nightly" ]; then
            signed_suffix="-signed"
          fi

          mv "$dir"/karasu-standard-universal-*"${signed_suffix}".apk karasu-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum karasu-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_UNIVERSAL_SHA=$sha" >> $GITHUB_ENV

          cp "$dir"/karasu-standard-arm64-v8a-*"${signed_suffix}".apk karasu-arm64-v8a-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum karasu-arm64-v8a-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_ARM64_V8A_SHA=$sha" >> $GITHUB_ENV

          cp "$dir"/karasu-standard-armeabi-v7a-*"${signed_suffix}".apk karasu-armeabi-v7a-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum karasu-armeabi-v7a-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_ARMEABI_V7A_SHA=$sha" >> $GITHUB_ENV

          cp "$dir"/karasu-standard-x86-*"${signed_suffix}".apk karasu-x86-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum karasu-x86-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_X86_SHA=$sha" >> $GITHUB_ENV

          cp "$dir"/karasu-standard-x86_64-*"${signed_suffix}".apk karasu-x86_64-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum karasu-x86_64-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_X86_64_SHA=$sha" >> $GITHUB_ENV

      - name: Create Release
        if: startsWith(env.VERSION_TAG, 'v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Karasu ${{ env.VERSION_TAG }}
          body: |
            ${{ github.event.inputs.message }}

            ${{ env.DEBUG_BUILD == 'true' && '> Debug-signed side-by-side test build; not release-signed.' || '' }}

            ${{ steps.changelog.outputs.CHANGELOG }}
            ---

            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | Universal | ${{ env.APK_UNIVERSAL_SHA }}
            | arm64-v8a | ${{ env.APK_ARM64_V8A_SHA }}
            | armeabi-v7a | ${{ env.APK_ARMEABI_V7A_SHA }}
            | x86 | ${{ env.APK_X86_SHA }} |
            | x86_64 | ${{ env.APK_X86_64_SHA }} |

            > [!TIP]
            >
            > If you are unsure which version to download then go with **karasu-${{ env.VERSION_TAG }}.apk**
          files: |
            karasu-${{ env.VERSION_TAG }}.apk
            karasu-arm64-v8a-${{ env.VERSION_TAG }}.apk
            karasu-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            karasu-x86-${{ env.VERSION_TAG }}.apk
            karasu-x86_64-${{ env.VERSION_TAG }}.apk
          draft: ${{ steps.version_stage.outputs.STAGE != 'beta' }}
          prerelease: ${{ steps.version_stage.outputs.STAGE == 'beta' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Nightly
        if: startsWith(env.VERSION_TAG, 'r') && env.NIGHTLY_PAT != ''
        uses: softprops/action-gh-release@v3
        with:
          repository: clevim/Karasu-nightly
          tag_name: ${{ env.VERSION_TAG }}
          name: Karasu Nightly (${{ env.VERSION_TAG }})
          body: |
            > [!CAUTION]
            > _**This alpha version is for testing only!**_
            >
            > This build is triggered by commit [`${{ env.COMMIT_SHORT_HASH }}`](https://github.com/clevim/Karasu/commit/${{ env.COMMIT_HASH }})

            It is not ready for daily use and we do not guarantee its usability. Please download the latest stable releases instead (https://github.com/clevim/Karasu/releases/latest). If you insist, please be sure to ALWAYS backup before updating.

            ${{ steps.changelog.outputs.CHANGELOG }}
            ---

            ### Checksums

            | Variant | SHA-256 |
            | ------- | ------- |
            | Universal | ${{ env.APK_UNIVERSAL_SHA }}
            | arm64-v8a | ${{ env.APK_ARM64_V8A_SHA }}
            | armeabi-v7a | ${{ env.APK_ARMEABI_V7A_SHA }}
            | x86 | ${{ env.APK_X86_SHA }} |
            | x86_64 | ${{ env.APK_X86_64_SHA }} |

            > [!TIP]
            >
            > If you are unsure which version to download then go with **karasu-${{ env.VERSION_TAG }}.apk**
          files: |
            karasu-${{ env.VERSION_TAG }}.apk
            karasu-arm64-v8a-${{ env.VERSION_TAG }}.apk
            karasu-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            karasu-x86-${{ env.VERSION_TAG }}.apk
            karasu-x86_64-${{ env.VERSION_TAG }}.apk
          draft: false
          prerelease: false
          token: ${{ secrets.NIGHTLY_PAT }}
